<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casey Margenau Fine Homes &amp; Estates — Portfolio — ImageWorks Creative</title>
  <meta name="description" content="A luxury real estate homepage for Northern Virginia's top-producing team — web design by ImageWorks Creative.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=8">
  <link rel="stylesheet" href="css/option-4.css?v=8">
</head>
<body>

  <!-- ===== ICONS =====
       Every mark on the page, drawn once on a 24px grid. Each use sets its
       own size and stroke through the .ic class in css/styles.css. -->
  <svg class="ip-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-arrow-d" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-arrow-cta" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </svg>

  <!-- ===== PAGE WASH ===== -->
  <div class="page-wash" aria-hidden="true">
    <span class="page-wash__g"></span>
    <span class="page-wash__b"></span>
    <span class="page-wash__s"></span>
  </div>

  <!-- ===== TOP ROW ===== -->
  <nav class="ip-top" aria-label="Portfolio navigation">
    <div class="iw-wrap">
      <a class="ip-back" href="https://imageworksc.github.io/portfolio-iwc/"><svg class="ic" aria-hidden="true"><use href="#i-arrow-l"/></svg>Back to portfolio</a>
      <a class="ip-fwd" href="option-1.html">Next project<svg class="ic" aria-hidden="true"><use href="#i-arrow-r"/></svg></a>
    </div>
  </nav>

  <!-- ===== HERO: the lane and the name ===== -->
  <section class="iw-hero">
    <div class="inner iwh-in">
      <div class="ip-chips">
        <a class="ip-chip ip-chip--on" href="https://imageworksc.github.io/portfolio-iwc/"><svg class="ic ic--sm" aria-hidden="true"><use href="#i-monitor"/></svg>Web</a>
        <span class="ip-chip">Website design</span>
      </div>
      <h1 class="ip-title" data-lines="2">Casey Margenau Fine Homes &amp; Estates</h1>
    </div>
  </section>

  <!-- ===== THE SCREENSHOT: the whole site, in one frame ===== -->
  <div class="o4-stage">
    <div class="iw-wrap">
      <div class="ip-browser">
        <div class="ip-browser__bar" aria-hidden="true"><i></i><i></i><i></i><span class="ip-browser__url">caseymargenau.com</span></div>
        <img src="assets/casey/full.jpg" srcset="assets/casey/full.jpg 1440w, assets/casey/full@2x.jpg 2880w" sizes="(min-width: 4800px) 3016px, (min-width: 3600px) 2320px, (min-width: 2800px) 1856px, (min-width: 2200px) 1450px, (min-width: 1208px) 1160px, calc(100vw - 32px)" width="1440" height="7784" alt="The Casey Margenau homepage from top to bottom: the hero over a stone estate, the sellers and buyers panels, a featured property, credentials, the four-step process, a testimonial, FAQs, the latest insight and the closing band." fetchpriority="high">
      </div>
    </div>
  </div>

  <!-- ===== CTA ===== -->
  <section class="iw-cta" id="contact">
    <div class="inner">
      <h2>Have a project in mind?</h2>
      <p>Whether you need a brand or a website that moves, our senior team handles it start to finish — all under one roof.</p>
      <a href="https://imageworksc.github.io/portfolio-iwc/#contact" class="iw-btn iw-btn--primary cta-btn">Get started today<svg class="ic" aria-hidden="true"><use href="#i-arrow-cta"/></svg></a>
    </div>
  </section>

  <!-- only the headline fitter runs here: there is no gallery to open and
       nothing to reveal -->
  <script src="js/app.js?v=8"></script>
</body>
</html>
