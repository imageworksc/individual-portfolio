  <!-- ===== ICONS =====
       Every mark on the page, drawn once on a 24px grid. Each use sets its
       own size and stroke through the .ic class in css/styles.css. -->
  <svg class="ip-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-arrow-d" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-arrow-cta" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

  <!-- ===== PAGE WASH ===== -->
  <div class="page-wash" aria-hidden="true">
    <span class="page-wash__g"></span>
    <span class="page-wash__b"></span>
    <span class="page-wash__s"></span>

  <!-- ===== TOP ROW ===== -->
  <nav class="ip-top" aria-label="Portfolio navigation">
    <div class="iw-wrap">
      <a class="ip-back" href="https://imageworksc.github.io/portfolio-iwc/"><svg class="ic" aria-hidden="true"><use href="#i-arrow-l"/></svg>Back to portfolio</a>
      <a class="ip-fwd" href="barr-group.html">Next project<svg class="ic" aria-hidden="true"><use href="#i-arrow-r"/></svg></a>
    </div>
  </nav>

  <!-- ===== HERO: the lane and the name ===== -->
  <section class="iw-hero">
    <div class="inner iwh-in">
      <div class="ip-chips">
        <a class="ip-chip ip-chip--on" href="https://imageworksc.github.io/portfolio-iwc/"><svg class="ic ic--sm" aria-hidden="true"><use href="#i-monitor"/></svg>Web</a>
        <span class="ip-chip">Website design</span>
        <span class="ip-chip">Interactions</span>
      </div>
      <h1 class="ip-title" data-lines="2">Highbrow Magazine</h1>
      <p><strong>Project:</strong> Custom website design.</p>
    </div>
  </section>

  <!-- ===== LIVE: the site itself, moving =====
       The build runs inside the frame. Until it is clicked it drifts down
       the page by itself (app.js, LIVE), so its scroll animations play;
       a click hands it the pointer — hover, scroll, open — and leaving the
       frame hands it back. -->
  <div class="o9-stage">
    <div class="iw-wrap">
        <figure class="ip-live ip-live--stage rv" data-autoscroll>
          <div class="ip-browser">
            <div class="ip-browser__bar" aria-hidden="true"><i></i><i></i><i></i><span class="ip-browser__url">highbrowmagazine.com</span></div>
            <div class="ip-live__view">
              <iframe data-build="highbrow" title="Highbrow Magazine homepage, live" tabindex="-1"></iframe>
              <button type="button" class="ip-live__on"><span class="ip-live__chip">Click to try it</span></button>
            </div>
          </div>
        </figure>
    </div>
  </div>

  <!-- ===== INTERACTIONS: one section of the build per slide =====
       Each slide holds one section, still — no scrolling inside, no
       header over it — and live to the pointer, so its hovers can be
       tried at once. The arrows step to the next section. -->
  <section class="ip-section o9-deep" aria-labelledby="interactions">
    <div class="iw-wrap">
      <div class="ip-carousel" data-carousel>
        <div class="ip-carousel__head rv">
          <h2 class="ip-eyebrow" id="interactions">Interactions</h2>
          <div class="ip-carousel__nav">
            <span class="ip-carousel__count" data-carousel-count aria-live="polite">1 / 4</span>
            <button type="button" class="ip-carousel__btn" data-carousel-prev aria-label="Previous section"><svg class="ic" aria-hidden="true"><use href="#i-arrow-l"/></svg></button>
            <button type="button" class="ip-carousel__btn" data-carousel-next aria-label="Next section"><svg class="ic" aria-hidden="true"><use href="#i-arrow-r"/></svg></button>
          </div>
        </div>
        <ul class="ip-carousel__track rv rv-d1" tabindex="0" aria-label="Interactive sections">
          <li class="ip-carousel__slide">
            <figure class="ip-live ip-live--section">
              <figcaption>Featured stories</figcaption>
              <div class="ip-browser">
                <div class="ip-browser__bar" aria-hidden="true"><i></i><i></i><i></i><span class="ip-browser__url">highbrowmagazine.com/#featured</span></div>
                <div class="ip-live__view">
                  <iframe data-build="highbrow" data-anchor="block-creative-views-block-featured-slider-block-1" data-hide="#navbar, #header_wrap" title="Highbrow Magazine homepage — Featured stories section, live" loading="lazy"></iframe>
                </div>
              </div>
            </figure>
          </li>
          <li class="ip-carousel__slide">
            <figure class="ip-live ip-live--section">
              <figcaption>Top stories</figcaption>
              <div class="ip-browser">
                <div class="ip-browser__bar" aria-hidden="true"><i></i><i></i><i></i><span class="ip-browser__url">highbrowmagazine.com/#top-stories</span></div>
                <div class="ip-live__view">
                  <iframe data-build="highbrow" data-anchor="block-creative-views-block-top-stories-block-1" data-hide="#navbar, #header_wrap" title="Highbrow Magazine homepage — Top stories section, live" loading="lazy"></iframe>
                </div>
              </div>
            </figure>
          </li>
          <li class="ip-carousel__slide">
            <figure class="ip-live ip-live--section">
              <figcaption>News</figcaption>
              <div class="ip-browser">
                <div class="ip-browser__bar" aria-hidden="true"><i></i><i></i><i></i><span class="ip-browser__url">highbrowmagazine.com/#news</span></div>
                <div class="ip-live__view">
                  <iframe data-build="highbrow" data-anchor="block-creative-views-block-news-block-1" data-hide="#navbar, #header_wrap" title="Highbrow Magazine homepage — News section, live" loading="lazy"></iframe>
                </div>
              </div>
            </figure>
          </li>
          <li class="ip-carousel__slide">
            <figure class="ip-live ip-live--section">
              <figcaption>Videos</figcaption>
              <div class="ip-browser">
                <div class="ip-browser__bar" aria-hidden="true"><i></i><i></i><i></i><span class="ip-browser__url">highbrowmagazine.com/#videos</span></div>
                <div class="ip-live__view">
                  <iframe data-build="highbrow" data-anchor="block-creative-views-block-youtube-block-1" data-hide="#navbar, #header_wrap" title="Highbrow Magazine homepage — Videos section, live" loading="lazy"></iframe>
                </div>
              </div>
            </figure>
          </li>
        </ul>
      </div>
    </div>
  </section>

  <!-- ===== CTA ===== -->
  <section class="iw-cta" id="contact">
    <div class="inner">
      <h2>Have a project in mind?</h2>
      <p>Whether you need a brand or a website that moves, our senior team handles it start to finish — all under one roof.</p>
      <a href="https://imageworksc.github.io/portfolio-iwc/#contact" class="iw-btn iw-btn--primary cta-btn">Get started today<svg class="ic" aria-hidden="true"><use href="#i-arrow-cta"/></svg></a>
    </div>
  </section>
