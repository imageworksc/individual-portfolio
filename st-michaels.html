/div> <div role="main" class="main-container container-fluid js-quickedit-main-content "> <div class="row"> <section class="col-sm-12"> <a id="main-content"></a> <div class="region region-content"> <article class="page full clearfix"> <div class="content"> <div> <div class="paragraph paragraph--type--bp-simple paragraph--view-mode--default paragraph--id--79 paragraph--width--wide" class="paragraph paragraph--type--bp-simple paragraph--view-mode--default paragraph--id--79 paragraph--width--wide" id="hero"> <div class="paragraph__column "> <div class="bp_text"><h1 class="text-align-center">Take Command of Your Back Office<sup>®</sup></h1> <p class="text-align-center">St. Michael’s brings concentrated expertise to back office management, allowing government agencies to focus on what they do best: keeping America safe.</p> <div class="box"> <div class="left"> <div class="inner"> <h3>Improving results for core business processes:</h3> <ul> <li><a href="/back-office-support">Back Office Support</a></li> <li><a href="/finance-accounting">Finance &amp; Accounting</a></li> <li><a href="/program-management">Program Management</a></li> <li><a href="/audit-sustainment">Audit Readiness</a></li> </ul> </div> </div> <div class="right"> <div class="inner"> <h3>From audit readiness to audit sustainment</h3> <p>St. Michael’s brings proven expertise and experience to overcome challenges, implement compliant and sustainable business practices, and prepare organizations to achieve an unmodified audit opinion.</p> <p><a class="box-button transparent" href="/audit-sustainment">GO</a></p> </div> </div> </div> </div> </div> </div> </div> <div> <div class="paragraph paragraph--type--bp-simple paragraph--view-mode--default paragraph--id--80 paragraph--width--wide" class="paragraph paragraph--type--bp-simple paragraph--view-mode--default paragraph--id--80 paragraph--width--wide" id="home2v2"> <div class="paragraph__column "> <div class="bp_text"><h2 class="text-align-center">Join the team that has a reputation for excellence.</h2> <p class="text-align-center"><a class="link-style" href="/jobs" rel=" noopener">VIEW OUR OPEN POSITIONS</a></p> <div class="boxes"> <div class="box linked" ref="/employee-ownership"> <div class="image"><img alt="Grow with the company in our Employee Stock Ownership Plan" data-entity-type="file" data-entity-uuid="ce3470cc-8ce3-4fe1-8c6d-4216cb020587" height="272" src="assets/stmichaels/site/sites/default/files/box1.jpg" width="590"></div> <div class="text">Grow with the company in our Employee Stock Ownership Plan</div> </div> <div class="box linked" ref="/heart-success"> <div class="image"><img alt="Learn about the values we put above the bottom line" data-entity-type="file" data-entity-uuid="680713de-8611-43cd-82a6-8054d699cc70" height="272" src="assets/stmichaels/site/sites/default/files/box2.jpg" width="590"></div> <div class="text">Learn about the values we put above the bottom line</div> </div> <div class="box linked" ref="/good-things-come-small-packages"> <div class="image"><img alt="See what it’s like to work at St. Michael’s" data-entity-type="file" data-entity-uuid="ce5bcbf9-cf24-46da-803b-9f8fcba6b4b8" src="assets/stmichaels/site/sites/default/files/SEPS%20picture.jpg" width="700"></div> <div class="text">See what it’s like to work at St. Michael’s</div> </div> <div class="box linked" ref="/benefits"> <div class="image"><img alt="Explore St. Michael’s Employee Benefits" data-entity-type="file" data-entity-uuid="fd3a9e5e-29d7-4cca-933a-fae1f3f3f6c8" height="272" src="assets/stmichaels/site/sites/default/files/box4.jpg" width="590"></div> <div class="text">Explore St. Michael’s Employee Benefits</div> </div> </div> </div> </div> </div> </div> <div> <div class="paragraph paragraph--type--bp-simple paragraph--view-mode--default paragraph--id--81 paragraph--width--wide paragraph--color paragraph--color--rgba-red-strong" class="paragraph paragraph--type--bp-simple paragraph--view-mode--default paragraph--id--81 paragraph--width--wide paragraph--color paragraph--color--rgba-red-strong" id="home3"> <div class="paragraph__column "> <div class="bp_text"><h2>We stand behind, so you can take the lead.</h2> <p>St. Michael’s is a service-disabled veteran-owned small business (SDVOSB) driven by the same principles that guide our armed forces. Founded by a U.S. Army Paratrooper, we are dedicated to the core values of: excellence in reputation, commitment, candor, teamwork, and dependability.</p> <p><a class="box-button transparent" href="/leadership">MEET OUR LEADERSHIP</a> <a class="box-button transparent-alt" href="/our-community">SEE HOW WE GIVE BACK</a></p> </div> </div> <div class="field_attached_image"> <img loading="lazy" src="assets/stmichaels/site/sites/default/files/2022-05/we-stand-2-sm.png" width="600" height="562" alt="We stand behind, so you can take the lead." class="img-responsive" /> </div> </div> </div> </div> </article> </div> </section> </div> </div> <footer class="footer container-fluid" role="contentinfo"> <div class="region region-footer"> <section id="block-footerlogo" class="settings-tray-editable block block-block-content block-block-contentda6530c0-a487-4815-ba87-5ad751e286aa clearfix" data-drupal-settingstray="editable"> <div class="body"><p><img alt="St Michaels Logo" data-entity-type="file" data-entity-uuid="eae71150-0bfd-4cd9-b4a6-176ac3ece169" height="69" src="assets/stmichaels/site/sites/default/files/footer-logo_0.png" width="178"></p> </div> </section> <section id="block-footermenu" class="settings-tray-editable block block-block-content block-block-contentaa7d3966-9c1e-483c-a232-725dae7cc36e clearfix" data-drupal-settingstray="editable"> <div class="body"><ul class="inline"> <li><a href="/contact">Get in touch</a></li> <li><a href="/partner-us">Partner with Us</a></li> <li><a href="/working-st-michaels">Careers</a></li> <li><a href="/our-community">Community Engagement</a></li> </ul> <p class="inline"><img alt="SDVOSB" data-entity-type="file" data-entity-uui
